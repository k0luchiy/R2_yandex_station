[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "r2d2-yandex-station"
version = "0.1.0"
description = "A voice and text gateway that puts your own opencode agent behind a private Yandex Station (Alice) skill."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "k0luchiy" }]
keywords = ["alice", "yandex", "station", "opencode", "voice", "telegram", "gateway"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
# Audited by importing the code, not by reading a requirements file: every
# distribution below is `import`ed by something under app/, core/ or opencode/.
# The 3.11 floor is what docs/01-overview.md and docs/08-deployment.md already
# state; the venv this was developed in is 3.13, and CI runs 3.11, 3.12 and 3.13.
dependencies = [
    # app/main.py, app/diagnostics.py, app/opencode_route.py
    "fastapi>=0.115",
    # the ASGI server: scripts/run_server.sh execs it, tests/test_e2e_stack.py
    # imports it to bind a real socket, and every document tells the operator to
    # run `uvicorn app.main:app`. No module under app/ imports it, which is
    # exactly why it is easy to forget and why it is listed here explicitly.
    "uvicorn[standard]>=0.30",
    # 16 modules: the opencode client, the SSE reader, the backends, the tools
    "httpx>=0.27",
    # core/memory.py
    "aiosqlite>=0.20",
    # core/tools/laptop_tool.py
    "psutil>=5.9",
    # app/config.py, inside a try/except: a missing .env loader is a warning,
    # not a crash, so this is a convenience rather than a hard requirement
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Everything needed to run the suite and the tools CI runs. Kept out of
# `dependencies` on purpose: nothing under app/ or core/ imports any of it.
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "respx>=0.21,<1",
    "pytest-cov>=5,<8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil>=5.9",
]

# There is deliberately no [project.scripts] entry point. R2D2 is an application,
# not a library: it has no `main()` of its own, the ASGI object is
# `app.main:app`, and adding one would mean editing app/ to satisfy packaging
# rather than to fix a defect. Start it the way the docs say:
#   uvicorn app.main:app --host 127.0.0.1 --port 8080
#
# `opencode/r2d2_cli/r2d2_do.py` is NOT installed as a package either. It is a
# standalone script that scripts/install_r2d2_opencode_config.sh copies to
# ~/.r2d2/r2d2_do.py, because that exact path is what the bash allowlist in
# config/opencode/r2d2.opencode.json names. Shipping a top-level `opencode`
# package would also squat the name of the CLI this project depends on.
# R2D2 is deployed from a clone, not from a wheel; `pip install -e .` gives you
# the interpreter, the dependencies and the importable packages.

[tool.setuptools]
# Explicit, because flat-layout auto-discovery would otherwise also try to
# package config/, docs/, qa/, scripts/ and tests/.
packages = [
    "app",
    "core",
    "core.backends",
    "core.opencode",
    "core.tools",
]

[tool.pytest.ini_options]
# Moved here from pytest.ini (2026-09-29) so that one file describes the
# project. pytest reads pytest.ini in preference to this table, so leaving both
# would have left one of them silently dead.
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
# app/ and core/ are imported in-process and are what the number is about.
# opencode/r2d2_cli/r2d2_do.py is excluded on purpose: tests/test_r2d2_do_cli.py
# exercises it as a SUBPROCESS, so in-process coverage cannot see it and would
# report a misleading 0% for a file the suite tests on every run.
source = ["app", "core"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false
# Anything below this is a file the suite barely touches. Nothing is excluded
# from the report: an exclusion here would be a number nobody could check.
fail_under = 0
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# The repository is not linted for line length: 1326 lines exceed 88 columns,
# most of them prose inside docstrings that explain a measured defect. Turning
# that on would mean rewrapping the explanations, which is a worse trade than
# the rule is worth. E4/E7/E9 are the other pycodestyle groups and are clean.
extend-exclude = [".venv", "db", ".omo", ".codegraph", "qa/*.out"]

[tool.ruff.lint]
select = [
    "E4",    # import hygiene
    "E7",
    "E9",    # syntax and IO errors
    "F",     # pyflakes: undefined names, unused imports, unused locals
    "I",     # import order
    "B",     # flake8-bugbear
    "UP",    # pyupgrade against py311
    "RET",   # return flow
    "C4",    # comprehensions
]
# RUF001/RUF002 (ambiguous unicode) are NOT selected on purpose: 132 of them
# are Russian text with typographic quotes and em dashes, which is correct
# Russian typography, not homoglyph confusion.

[tool.ruff.lint.per-file-ignores]
# A known-findings ledger, added 2026-09-29 with the first CI run. Every entry
# is an ENUMERATED finding in a file that belongs to another change, not a
# blanket suppression. Four of them are real defects rather than style, and
# they are written up in README.md's "Known findings" section so a reader of a
# green badge learns what the badge does not cover. Delete a line here when the
# file it names is fixed; `ruff check .` then holds that fix in place.
"app/*" = [
    "F401",
    "F822",  # __all__ names a name the module never imports
    "I001",
    "RET501",
]
"core/*" = [
    "F401",  # a deliberate, undocumented re-export compatibility surface
    "F821",  # `Mapping` used in an annotation, never imported
    "I001",
    "UP017",  # `timezone.utc` rather than the 3.11 `datetime.UTC` alias
    "UP041",  # `asyncio.TimeoutError` rather than the builtin `TimeoutError`
]
"opencode/*" = ["UP035"]
"qa/*" = ["E741", "F401", "I001"]
"scripts/*" = ["F841", "I001"]
"tests/*" = [
    "B009",   # getattr() with a constant name, used to prove a re-export works
    "B017",   # pytest.raises(Exception): the point is that NOTHING escapes
    "B033",   # a set literal repeats "REJECTED"; sets dedupe, so it is a typo
    "F821",   # a dead `X if False else Y` branch names an undefined constant
    "F841",   # locals bound only to keep a debugger breakpoint meaningful
    "I001",
    "RET501",
    "UP037",
]

[tool.mypy]
python_version = "3.11"
files = ["app", "core", "opencode"]
# The suite is the specification here, not a type checker: the code is
# dynamically shaped (JSON specs, SSE frames, FastAPI handlers) and `--strict`
# would report thousands of `Any` on code that is correct and tested. These are
# the checks that find real defects rather than missing annotations.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = false
no_implicit_optional = true
strict_equality = false
disallow_untyped_defs = false
# aiosqlite, psutil (types-psutil is in the dev group) and the SSE machinery all
# cross an untyped boundary. `ignore_missing_imports` is scoped to those two so
# a typo in any OTHER import still fails.
[[tool.mypy.overrides]]
module = ["psutil.*"]
ignore_missing_imports = true
